project:
  name: "黔址优选：城市社区商业价值洞察与智能选址平台"
  city: "贵阳市"
  grid_size_m: 1000
  default_radius_m: 500
  optional_radius_m: [500, 800, 1000]
  business_types:
    - "社区便利店"
    - "轻餐饮"
  recommendation_granularity:
    - "区域"
    - "街道"
    - "社区"
    - "评价网格"

target_districts:
  first_version:
    - "云岩区"
    - "南明区"
    - "观山湖区"
  optional_enhancement:
    - "花溪区"
    - "白云区"

data_paths:
  official_raw_dir: "data/raw/official"
  official_processed_dir: "data/processed/official"
  processed_dir: "data/processed"
  results_dir: "outputs/results"
  results_metadata_dir: "outputs/results/metadata"
  reports_dir: "outputs/reports"
  figures_dir: "outputs/figures"
  amap_cache_dir: "data/cache/amap"
  demo_dir: "data/demo"

poi_categories:
  convenience_store: "便利店"
  supermarket: "超市"
  restaurant: "餐饮"
  fast_food: "快餐"
  snack: "小吃"
  cafe: "咖啡"
  tea: "茶饮"
  school: "学校"
  hospital: "医院"
  mall: "商场"
  office: "写字楼"
  residential: "小区"
  bus_stop: "公交站"
  subway_station: "地铁站"
  parking: "停车场"

poi_typecodes:
  convenience_store: "060200"
  supermarket: "060400"
  restaurant: "050000"
  fast_food: "050300"
  snack: "050400|050800|050900"
  cafe: "050500"
  tea: "050700"
  school: "141200"
  hospital: "090100|090200"
  mall: "060100"
  office: "120201"
  residential: "120300"
  bus_stop: "150700"
  subway_station: "150500"
  parking: "150900"

weights:
  convenience:
    traffic_accessibility: 0.20
    consumption_potential: 0.25
    employment_customer_proxy: 0.10
    synergy_score: 0.20
    competition_pressure: 0.15
    business_atmosphere: 0.10
  light_food:
    traffic_accessibility: 0.15
    consumption_potential: 0.10
    employment_customer_proxy: 0.25
    synergy_score: 0.20
    competition_pressure: 0.15
    business_atmosphere: 0.15

scoring_templates:
  community_retail:
    synergy_field: "convenience_synergy_score"
    competition_field: "convenience_competition_pressure"
  food_service:
    synergy_field: "light_food_synergy_score"
    competition_field: "light_food_competition_pressure"

map:
  provider: "amap_js"
  js_api_version: "2.0"
  map_style: "amap://styles/whitesmoke"
  default_zoom: 11
  height: 680
  top_n: 10
  enable_folium_fallback: true

llm:
  provider: "deepseek"
  base_url: "https://api.deepseek.com"
  primary_model: "deepseek-v4-pro"
  fallback_model: "deepseek-v4-flash"
  timeout_seconds: 60
  primary_max_retries: 1
