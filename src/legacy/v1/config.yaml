project:
  name: "黔址优选 v1"
  business_types:
    - "社区便利店"
    - "轻餐饮"
  recommendation_granularity:
    - "区域"
    - "街道"
    - "社区"
    - "评价网格"

paths:
  raw_data: "data/legacy/v1/raw"
  raw_official_data: "data/raw/official"
  raw_osm_data: "data/legacy/v1/raw/osm_guizhou"
  processed_data: "data/legacy/v1/processed"
  processed_official: "data/processed/official"
  processed_osm_region: "data/legacy/v1/processed/osm_region"
  processed_site_selection: "data/legacy/v1/processed/site_selection"
  figures: "outputs/legacy/v1/figures"
  reports: "outputs/legacy/v1/reports"
  results: "outputs/legacy/v1/results"
  results_region_stage: "outputs/legacy/v1/results/region_stage"
  results_grid_stage: "outputs/legacy/v1/results/grid_stage"
  results_metadata: "outputs/legacy/v1/results/metadata"

spatial_data:
  osm_guizhou:
    gpkg_url: "https://download.geofabrik.de/asia/china/guizhou-latest-free.gpkg.zip"
    shp_url: "https://download.geofabrik.de/asia/china/guizhou-latest-free.shp.zip"
    extract_dir: "data/legacy/v1/raw/osm_guizhou"
    grid_size_m: 1000
    selected_region_count: 5

model_defaults:
  top_n: 5
  grid_size_m: 1000

weights:
  convenience_store:
    consumption_potential: 0.25
    traffic_accessibility: 0.25
    competition_pressure_reversed: 0.20
    synergy_business_score: 0.20
    regional_development: 0.10
  light_catering:
    consumption_potential: 0.20
    traffic_accessibility: 0.25
    competition_pressure_reversed: 0.20
    synergy_business_score: 0.25
    regional_development: 0.10
